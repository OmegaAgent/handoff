id: C-7
title: A raw secret value is refused, and the value appears in no artifact anywhere
level: 1
invariants: [I7, I18]
spec:
  - "§4.3 — the derived authority floor for any request declaring a secret field"
  - "§5.3.4 — a raw value for a secret field is 422"
  - "§12 — out-of-band secret custody"
  - "§16.5 — the transport is part of the custody requirement"
  - "§18 C-7 — this is a scan, not a unit test"
rationale: >
  §12.3 is written as a testable sentence: a secret value must not appear in a URL, a query string,
  a path segment, a process argument vector, an environment variable, an HTTP header, a redirect
  target, a log line, a metric label, a trace attribute, or a crash report. This case therefore
  greps every artifact the scenario produced rather than inspecting the one response that happened
  to be convenient. The `logs` source is not optional: a deployment that cannot show its logs to
  the suite has not demonstrated the property, and the case fails.

requires:
  principals: [machine_a, human_admin]
  hooks: [logs]

steps:
  - name: raise a login-assistance request with a secret field
    http:
      method: POST
      path: /requests
      as: machine_a
      headers:
        Idempotency-Key: "c07-${run_id}"
      body:
        waiter_ref: "run:c07-${run_id}"
        prompt:
          title: "Sign in to app.example.com for this workspace's browser"
          body: "Your credentials go straight to the browser and never pass through the agent."
        requires:
          v: 1
          answer:
            fields:
              - name: email
                label: "Email or username"
                type: text
                required: true
              - name: password
                label: Password
                type: secret
                required: true
            value_sink:
              provider: "conformance/sink"
              op: submit_credentials
              ref: "snk_01K3M7QW8ZC4YRXB2N6VD9FTHF"
          capabilities: []
          authority:
            min_role: admin
            auth_strength: session
        metadata:
          hint: credential
      expect:
        status: 201
        body:
          - path: requires.answer.fields[1].type
            equals: secret
      capture:
        req: id
        sink: requires.answer.value_sink.ref

  - name: answering with the raw password is refused
    http:
      method: POST
      path: /requests/${req}/answer
      as: human_admin
      headers:
        Idempotency-Key: "c07-raw-${run_id}"
      body:
        values:
          email: "dana@example.com"
          password: "hunter2-Zx9Q-conformance-${run_id}"
      expect:
        status: 422
        body:
          - path: error.code
            equals: answer_validation_failed
            because: "§5.3.4 — a raw value against a secret field is a validation failure"
          - path: error.fields[0].name
            equals: password
            because: "§13 — 422 carries per-field detail so the surface can mark the input"
          - path: error.fields[0].code
            equals: secret_value_not_permitted
          - path: ""
            not_contains_text: "hunter2-Zx9Q-conformance-${run_id}"
            because: >
              §12.6 — a Server MUST NOT echo a submitted value back in any response, including a
              validation error. Echoing the rejected value is the single most common way this leaks.

  - name: the value goes to the declared sink instead
    http:
      method: POST
      path: /sinks/${sink}/values
      as: human_admin
      headers:
        Idempotency-Key: "c07-sink-${run_id}"
      body:
        values:
          email: "dana@example.com"
          password: "hunter2-Zx9Q-conformance-${run_id}"
      expect:
        status: 202
        body:
          - path: accepted
            length: 2
            because: "§12 — the sink echoes names only"
          - path: ""
            not_contains_text: "hunter2-Zx9Q-conformance-${run_id}"
            because: "§12 — a response that echoed a value would defeat the point of the sink"

  - name: an undeclared key cannot be smuggled through the sink
    http:
      method: POST
      path: /sinks/${sink}/values
      as: human_admin
      headers:
        Idempotency-Key: "c07-smuggle-${run_id}"
      body:
        values:
          not_a_declared_field: "hunter2-Zx9Q-conformance-${run_id}"
      expect:
        status: 400
        body:
          - path: error.code
            equals: invalid_request
            because: >
              §12.1 — a sink MUST reject any key that is not a declared field name, so a compromised
              surface cannot smuggle arbitrary keys to the runtime

  - name: the answer carries only the fact of provision
    http:
      method: POST
      path: /requests/${req}/answer
      as: human_admin
      headers:
        Idempotency-Key: "c07-answer-${run_id}"
      body:
        values:
          email: "dana@example.com"
          password: {provided: true}
      expect:
        status: 200
        body:
          - path: request.state
            equals: answered

  - name: the receipt reduces the secret to the fact of provision
    http:
      method: GET
      path: /requests/${req}/receipt
      as: machine_a
      expect:
        status: 200
        body:
          - path: decision.values.password.provided
            equals: true
            because: "§9.1 — secret fields are reduced to {\"provided\": true} on the receipt"

  - name: scan every artifact the scenario produced for the value
    scan:
      for: ["hunter2-Zx9Q-conformance-${run_id}"]
      in: [traffic, urls, headers, request, receipt, deliveries, signals, logs]
      request: "${req}"
      waiter_ref: "run:c07-${run_id}"
      as: machine_a
      because: >
        §12.2 and §12.3 — values must not enter the request, the receipt, the event record, a waiter
        signal, a delivery, a notification, an error message, a URL, a query string, a header, or a
        log line. I18 makes the list normative; this scan is what makes it true.
