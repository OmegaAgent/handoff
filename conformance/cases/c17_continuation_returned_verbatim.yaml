id: C-17
title: Continuation state is returned byte-identical in the signal and stored nowhere else
level: 2
invariants: []
spec:
  - "§1.3 — the Server provides storage and verbatim return; it does not provide continuation"
  - "§14 — the continuation extension"
  - "§18 C-17 (Level 2)"
rationale: >
  Level 2 is deliberately the whole of the extension: the Server stores a pointer or a blob and
  never stores meaning. A runtime that can snapshot its own state gets true continuation from its
  own snapshot; a runtime that cannot ignores these fields and loses nothing the protocol ever
  promised. The two assertions that matter are therefore **byte-identical return** and **nowhere
  else** — a `resume_payload` that turns up in a listing or a log line is a runtime's private state
  leaking through a service that promised not to interpret it.

requires:
  principals: [machine_a, human_editor]
  hooks: [logs]

steps:
  - name: the deployment advertises Level 2
    http:
      method: GET
      path: /meta
      as: anonymous
      expect:
        status: 200
        body:
          - path: conformance_level
            equals: 2
            because: >
              §1.2 — a Server MUST NOT advertise Level 2 unless it passes this case, and this case
              is only required of a Server that advertises it
          - path: extensions
            contains_text: continuation

  - name: raise carrying a resume pointer and an opaque payload
    http:
      method: POST
      path: /requests
      as: machine_a
      headers:
        Idempotency-Key: "c17-${run_id}"
      body:
        waiter_ref: "run:c17-${run_id}"
        liveness: durable
        resume_ref: "s3://checkpoints/c17-${run_id}/step-14.msgpack"
        resume_payload: "Q09ORk9STUFOQ0UtQzE3LSR7cnVuX2lkfS1PUEFRVUUtQkxPQg=="
        prompt:
          title: "Approve the batch?"
        requires:
          v: 1
          answer:
            fields:
              - name: decision
                type: choice
                required: true
                options:
                  - {id: approve, label: "Approve"}
                  - {id: reject, label: "Reject"}
          capabilities: []
          authority: {min_role: editor, auth_strength: session}
      expect:
        status: 201
      capture:
        req: id

  - name: the request representation does not carry them back
    http:
      method: GET
      path: /requests/${req}
      as: machine_a
      expect:
        status: 200
        body:
          # The positive control first. Three of this case's assertions are absences, and an absence
          # is satisfied by any document that is not the one the case means — an error envelope, an
          # empty page, a body that did not parse. So each of them now sits next to a statement that
          # this IS the request, which fails if the read went somewhere else.
          - path: id
            same_as: req
          - path: state
            equals: pending
          - path: resume_ref
            exists: false
            because: "§14 — returned in every signal for that request, and nowhere else"
          - path: resume_payload
            exists: false

  - name: nor does a listing
    http:
      method: GET
      path: /requests
      as: machine_a
      query:
        waiter_ref: "run:c17-${run_id}"
      expect:
        status: 200
        body:
          - path: data
            length_at_least: 1
            because: >
              The control. An empty listing contains no continuation state and no request either,
              so the assertion below would hold over a page that never showed this request at all.
          - path: data[0].id
            same_as: req
          - path: ""
            not_contains_text: "Q09ORk9STUFOQ0UtQzE3"
            because: "§14 — not in a listing"

  - name: the person answers
    http:
      method: POST
      path: /requests/${req}/answer
      as: human_editor
      headers:
        Idempotency-Key: "c17-answer-${run_id}"
      body:
        values: {decision: approve}
      expect:
        status: 200

  - name: the signal returns both byte-identical
    poll:
      timeout: PT30S
      interval: PT1S
      call:
        method: GET
        path: /waiters/run%3Ac17-${run_id}/signals
        as: machine_a
        expect:
          status: 200
          body:
            - path: data[0].type
              equals: answered
            - path: data[0].resume_ref
              equals: "s3://checkpoints/c17-${run_id}/step-14.msgpack"
              because: "§14 — stored verbatim, never dereferenced, parsed, or interpreted"
            - path: data[0].resume_payload
              equals: "Q09ORk9STUFOQ0UtQzE3LSR7cnVuX2lkfS1PUEFRVUUtQkxPQg=="
              because: "§14 — byte-identical, not re-encoded and not normalized"

  - name: the receipt does not carry them
    http:
      method: GET
      path: /requests/${req}/receipt
      as: machine_a
      expect:
        status: 200
        body:
          - path: request_id
            same_as: req
            because: "The control: this is the receipt for the request the case raised."
          - path: chain.digest
            matches: "^sha256:"
          - path: ""
            not_contains_text: "Q09ORk9STUFOQ0UtQzE3"
            because: "§14 — not in a receipt"

  - name: and neither do the logs
    scan:
      for:
        - "Q09ORk9STUFOQ0UtQzE3LSR7cnVuX2lkfS1PUEFRVUUtQkxPQg=="
      in: [logs, urls, headers]
      as: machine_a
      because: >
        §14 — a Server MUST NOT log resume_payload. This is a pointer-sized escape hatch for a
        runtime's private state, not a state store the operator gets to read.
