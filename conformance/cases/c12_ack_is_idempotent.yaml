id: C-12
title: Acking twice returns 200 twice, stops redelivery once, and applies nothing twice
level: 1
invariants: [I9]
spec:
  - "§3.5 — ack a signal is idempotent under signal_id"
  - "§8.3 — reading a signal MUST NOT consume it; the ack is the consumption"
  - "§18 C-12"
rationale: >
  At-least-once delivery plus an idempotent ack is what "effectively once" actually means, and the
  `first_ack` flag is what lets a runtime tell the write from the replay. The final step also
  records the honest case: `applied: false` with a reason is not an error. It says the decision
  arrived and could not be acted on, which is a fact the record should hold rather than swallow.

requires:
  principals: [machine_a, human_editor]

steps:
  - name: raise and answer, producing a signal
    http:
      method: POST
      path: /requests
      as: machine_a
      headers:
        Idempotency-Key: "c12-${run_id}"
      body:
        waiter_ref: "run:c12-${run_id}"
        liveness: durable
        prompt:
          title: "Approve the discount?"
        requires:
          v: 1
          answer:
            fields:
              - name: decision
                type: choice
                required: true
                options:
                  - {id: approve, label: "Approve"}
                  - {id: reject, label: "Reject"}
          capabilities: []
          authority: {min_role: editor, auth_strength: session}
      expect:
        status: 201
      capture:
        req: id

  - name: the person answers
    http:
      method: POST
      path: /requests/${req}/answer
      as: human_editor
      headers:
        Idempotency-Key: "c12-answer-${run_id}"
      body:
        values: {decision: approve}
      expect:
        status: 200

  - name: read the signal without consuming it
    poll:
      timeout: PT30S
      interval: PT1S
      call:
        method: GET
        path: /waiters/run%3Ac12-${run_id}/signals
        as: machine_a
        expect:
          status: 200
          body:
            - path: data[0].type
              equals: answered
            - path: data[0].sequence
              exists: true
              because: "§8.3 — each signal carries a sequence, monotonic per waiter_ref"
        capture:
          signal: data[0].id
          token: data[0].resume_token

  - name: ack it
    http:
      method: POST
      path: /signals/${signal}/ack
      as: machine_a
      headers:
        Idempotency-Key: "c12-ack-1-${run_id}"
      body:
        resume_token: "${token}"
        applied: true
      expect:
        status: 200
        body:
          - path: first_ack
            equals: true
          - path: acked_at
            exists: true

  - name: ack it again
    http:
      method: POST
      path: /signals/${signal}/ack
      as: machine_a
      headers:
        Idempotency-Key: "c12-ack-2-${run_id}"
      body:
        resume_token: "${token}"
        applied: true
      expect:
        status: 200
        body:
          - path: first_ack
            equals: false
            because: >
              §3.5 — the repeat is a 200 with first_ack false. A second ack is a retry, not a second
              application: an implementation that applies the decision again has double-spent it.

  # Positive control, for the same reason as C-21: an unknown waiter also returns an empty list, so
  # "the acked signal is no longer listed" is satisfied by an empty list from any cause — including
  # a waiter the Server never had. A review demonstrated exactly that. Asserting `length: 0`
  # instead does not fix it, because emptiness is what the endpoint reports either way. The fix is
  # to put a DIFFERENT signal in the same queue: a second request on the same waiter, answered and
  # left unacked. The list is then non-empty, and "the acked one is not in it" can fail.
  - name: a positive control — a second request on the same waiter
    http:
      method: POST
      path: /requests
      as: machine_a
      headers:
        Idempotency-Key: "c12-control-${run_id}"
      body:
        waiter_ref: "run:c12-${run_id}"
        prompt:
          title: "A second request on the same waiter, answered and deliberately left unacked"
        requires:
          v: 1
          answer:
            fields:
              - name: decision
                type: choice
                required: true
                options:
                  - {id: approve, label: "Approve"}
                  - {id: reject, label: "Reject"}
          capabilities: []
          authority: {min_role: editor, auth_strength: session}
      expect:
        status: 201
      capture:
        control: id

  - name: answer it, so this waiter has a signal it has not acked
    http:
      method: POST
      path: /requests/${control}/answer
      as: human_editor
      headers:
        Idempotency-Key: "c12-control-answer-${run_id}"
      body:
        values: {decision: approve}
      expect:
        status: 200

  - name: the acked signal is consumed and no longer pending
    poll:
      timeout: PT30S
      interval: PT1S
      call:
        method: GET
        path: /waiters/run%3Ac12-${run_id}/signals
        as: machine_a
        expect:
          status: 200
          body:
            - path: data
              length: 1
              because: >
                the positive control. The second request's signal is here and unacked; the first
                one's is not. An empty list would prove neither, and is what a Server returns for a
                waiter it has never heard of.
            - path: data[0].type
              equals: answered
              because: "the signal that remains is the unacked one, which is a real pending signal"
            - path: data[].id
              none_equal: "${signal}"
              because: "§8.2 W4 — the ack stops redelivery"

  - name: redelivery stopped exactly once
    http:
      method: GET
      path: /signals/${signal}/attempts
      as: machine_a
      expect:
        status: 200
        body:
          - path: data
            exists: true
            because: "§15.5 — every attempt must be inspectable by the tenant"
