id: C-4
title: A cancel arriving after an answer loses, and the receipt is intact
level: 1
invariants: [I5]
spec:
  - "§6.2 R11 — the person's answer wins"
  - "§6.5 — cancellation and supersession"
  - "§18 C-4"
rationale: >
  R11 is a product rule, not an edge case. A machine changing its mind a millisecond after a person
  acted must not discard that person's work — and the cancel must not half-apply either: the state
  stays `answered` and the receipt is byte-for-byte what it was.

requires:
  principals: [machine_a, human_editor]

steps:
  - name: raise a request
    http:
      method: POST
      path: /requests
      as: machine_a
      headers:
        Idempotency-Key: "c04-${run_id}"
      body:
        waiter_ref: "run:c04-${run_id}"
        prompt:
          title: "Send the contract to Acme?"
        requires:
          v: 1
          answer:
            fields:
              - name: decision
                type: choice
                required: true
                options:
                  - {id: send, label: "Send it"}
                  - {id: hold, label: "Hold"}
          capabilities: []
          authority: {min_role: editor, auth_strength: session}
      expect:
        status: 201
      capture:
        req: id

  - name: a person answers
    http:
      method: POST
      path: /requests/${req}/answer
      as: human_editor
      headers:
        Idempotency-Key: "c04-answer-${run_id}"
      body:
        values: {decision: send}
        note: "Checked with legal."
      expect:
        status: 200
        body:
          - path: request.state
            equals: answered
      capture:
        receipt: receipt.id
        digest: receipt.digest

  - name: the requester tries to cancel a millisecond too late
    http:
      method: POST
      path: /requests/${req}/cancel
      as: machine_a
      headers:
        Idempotency-Key: "c04-cancel-${run_id}"
      body:
        reason: "changed my mind"
      expect:
        status: 409
        body:
          - path: error.code
            equals: already_answered
            because: "§6.5 — a cancel racing a landed answer returns 409 and changes nothing"
          - path: error.receipt_id
            same_as: receipt
            because: "§13 — a 409 about a settled request carries the settling record"

  - name: the state did not move
    http:
      method: GET
      path: /requests/${req}
      as: machine_a
      expect:
        status: 200
        body:
          - path: state
            equals: answered
            because: "§6.1 — a Server MUST NOT transition out of a terminal state"
          - path: cancel_reason
            is_null: true
            because: "the cancel was refused, so it left no trace on the request"

  - name: the receipt is intact
    http:
      method: GET
      path: /requests/${req}/receipt
      as: machine_a
      expect:
        status: 200
        body:
          - path: id
            same_as: receipt
          - path: decision.values.decision
            equals: send
            because: "the person's decision, unaltered by the racing cancel"
          - path: chain.digest
            same_as: digest
            because: "§9.4 — an intact receipt has an intact chain entry"
