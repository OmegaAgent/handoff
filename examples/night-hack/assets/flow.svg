<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="An agent calls clear_wall and blocks. Handoff holds the request and pages a phone. A person answers, drives the agent's own browser through a live view, and presses I cleared it. Handoff POSTs resume and the blocked call returns.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.6 L10 5 L0 9.4 z" fill="#6E6A60"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.6 L10 5 L0 9.4 z" fill="#3D6B44"/>
    </marker>
  </defs>

  <style>
    .t { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #26241F; }
    .s { font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6E6A60; }
    .l { font: 500 12.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6E6A60; }
    .lg { font: 600 12.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3D6B44; }
    .box { fill: #FFFFFF; stroke: #E3DFD7; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="1000" height="330" rx="12" fill="#FAFAF8"/>

  <!-- the four participants -->
  <rect class="box" x="13" y="64" width="176" height="76" rx="10"/>
  <text class="t" x="101" y="97" text-anchor="middle">Agent</text>
  <text class="s" x="101" y="119" text-anchor="middle">hits a wall, blocks</text>

  <rect class="box" x="279" y="64" width="176" height="76" rx="10"/>
  <text class="t" x="367" y="97" text-anchor="middle">Handoff</text>
  <text class="s" x="367" y="119" text-anchor="middle">holds the request</text>

  <rect class="box" x="545" y="64" width="176" height="76" rx="10"/>
  <text class="t" x="633" y="97" text-anchor="middle">Phone</text>
  <text class="s" x="633" y="119" text-anchor="middle">speaks the reason</text>

  <rect class="box" x="811" y="64" width="176" height="76" rx="10"/>
  <text class="t" x="899" y="97" text-anchor="middle">Person</text>
  <text class="s" x="899" y="119" text-anchor="middle">takes the wheel</text>

  <!-- forward path -->
  <line x1="199" y1="102" x2="267" y2="102" stroke="#6E6A60" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="l" x="233" y="90" text-anchor="middle">clear_wall()</text>

  <line x1="465" y1="102" x2="533" y2="102" stroke="#6E6A60" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="l" x="499" y="90" text-anchor="middle">pages</text>

  <line x1="731" y1="102" x2="799" y2="102" stroke="#6E6A60" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="l" x="765" y="90" text-anchor="middle">answers</text>

  <!-- live view: the person acts inside the agent's own browser -->
  <path d="M70 142 V 214 H 860 V 142" fill="none" stroke="#3D6B44" stroke-width="1.5"
        stroke-dasharray="6 5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text class="lg" x="465" y="206" text-anchor="middle">live view of the agent's own browser: frames out, clicks and keys in</text>

  <!-- resolution: the only path that unblocks the call -->
  <path d="M938 142 V 286 H 132 V 142" fill="none" stroke="#6E6A60" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="l" x="535" y="278" text-anchor="middle">“I cleared it” &#8594; /resolve &#8594; POST /resume &#8594; the blocked call returns</text>
</svg>
