[project]
name = "handoff-human"
version = "0.1.0"
description = "await human() for AI agents: page a real person, let them take the wheel, resume the run"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Noureddin Bakir" }]
keywords = ["ai", "agents", "human-in-the-loop", "captcha", "browser-automation"]
dependencies = []  # the SDK is standard library only, on purpose

[project.urls]
Homepage = "https://handoff.omegas.dev"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["human"]
