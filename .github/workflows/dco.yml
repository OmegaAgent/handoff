name: DCO

# Every commit must carry a Signed-off-by trailer (CONTRIBUTING.md). There is no CLA, so the DCO
# is the whole of the provenance record — which makes this check load-bearing rather than
# ceremonial. It uses no secret and no third-party action.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailers
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"

          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format='%s' "$sha")
            author_name=$(git log -1 --format='%an' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")
            trailers=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")

            if [ -z "$trailers" ]; then
              echo "::error::${sha:0:8} \"$subject\" has no Signed-off-by trailer."
              failed=1
              continue
            fi

            if ! printf '%s\n' "$trailers" | grep -qiF "$author_name <$author_email>"; then
              echo "::error::${sha:0:8} \"$subject\" is signed off, but not by its author"
              echo "::error::  author:   $author_name <$author_email>"
              echo "::error::  sign-off: $(printf '%s' "$trailers" | tr '\n' ' ')"
              failed=1
              continue
            fi

            echo "ok  ${sha:0:8}  $subject"
          done < <(git rev-list "$base"..HEAD)

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          ------------------------------------------------------------------
          How to fix

            Last commit:   git commit --amend -s --no-edit
            Whole branch:  git rebase --signoff ${{ github.base_ref }}
            From now on:   git commit -s

          The sign-off asserts the Developer Certificate of Origin 1.1
          (https://developercertificate.org/) and must use your real name and
          the same email as the commit author. There is no CLA to sign.
          See CONTRIBUTING.md.
          ------------------------------------------------------------------
          EOF
            exit 1
          fi

          echo "All commits signed off."
