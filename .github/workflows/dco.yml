name: DCO

# Every commit must carry a Signed-off-by trailer (CONTRIBUTING.md). There is no CLA, so the DCO
# is the whole of the provenance record — which makes this check load-bearing rather than
# ceremonial. It uses no secret and no third-party action.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The commits to check are the ones the pull request proposes, taken from the event itself.
      # `origin/<base_ref>..HEAD` was close but not the same set: for a `pull_request` event
      # actions/checkout builds a synthetic merge of the head into the base and checks THAT out,
      # so HEAD is a merge commit GitHub wrote, it carries no trailer the way no merge commit
      # does, and it would be reported against a contributor who cannot sign it and did not write
      # it. A commit the author cannot fix is not a gate, it is a wall. Both SHAs are present in
      # the checkout because they are the two parents of the ref that was cloned at full depth.
      - name: Check Signed-off-by trailers
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          for sha in "$base" "$head"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::${sha} is not in this checkout. The job needs fetch-depth: 0."
              exit 1
            fi
          done

          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format='%s' "$sha")
            author_name=$(git log -1 --format='%an' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")
            trailers=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")

            if [ -z "$trailers" ]; then
              echo "::error::${sha:0:8} \"$subject\" has no Signed-off-by trailer."
              failed=1
              continue
            fi

            if ! printf '%s\n' "$trailers" | grep -qiF "$author_name <$author_email>"; then
              echo "::error::${sha:0:8} \"$subject\" is signed off, but not by its author"
              echo "::error::  author:   $author_name <$author_email>"
              echo "::error::  sign-off: $(printf '%s' "$trailers" | tr '\n' ' ')"
              failed=1
              continue
            fi

            echo "ok  ${sha:0:8}  $subject"
          done < <(git rev-list "$base".."$head")

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          ------------------------------------------------------------------
          How to fix

            Last commit:   git commit --amend -s --no-edit
            Whole branch:  git rebase --signoff ${{ github.base_ref }}
            From now on:   git commit -s

          The sign-off asserts the Developer Certificate of Origin 1.1
          (https://developercertificate.org/) and must use your real name and
          the same email as the commit author. There is no CLA to sign.
          See CONTRIBUTING.md.
          ------------------------------------------------------------------
          EOF
            exit 1
          fi

          echo "All commits signed off."
