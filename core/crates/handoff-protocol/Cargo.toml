[package]
name = "handoff-protocol"
description = "Pure types, state machine, and policy evaluation for the Handoff protocol. No I/O."
license = "Apache-2.0"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# This crate performs no I/O *by construction*, and the dependency list is where that is enforced.
# There is no async runtime, no HTTP client, no database driver, and no filesystem access here.
#
# `chrono` is deliberately built without its `clock` feature: with `clock` off, `Utc::now()` does not
# exist, so nothing in this crate can read the wall clock even by accident. Time enters through the
# injected `Clock` trait in `clock.rs`; a real system clock belongs to `handoff-core`.
[dependencies]
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
